interface:
  display_name: "Hoonsoo"
  short_description: "Save-triggered content and grammar review"
  default_prompt: "Use $hoonsoo <filepath> <prompt> to monitor disk-backed saves and review both content and grammar without editing the file."

dependencies:
  tools:
    - type: "mcp"
      value: "hoonsoo"
      description: "Read-only document monitor with versioned session-memory review artifacts"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
