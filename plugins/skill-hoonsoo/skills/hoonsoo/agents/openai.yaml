interface:
  display_name: "Hoonsoo"
  short_description: "Read-only live context and grammar review"
  default_prompt: "Use $hoonsoo to monitor a local document, give numbered natural-language advice with its revision only after meaningful changes settle, stay silent while waiting, and stop after the idle policy."

dependencies:
  tools:
    - type: "mcp"
      value: "hoonsoo"
      description: "Read-only local document monitor and revision-aware diff service"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
