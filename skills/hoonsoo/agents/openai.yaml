interface:
  display_name: "Hoonsoo"
  short_description: "Read-only live context and grammar review"
  default_prompt: "Use $hoonsoo to monitor a local document in context mode and keep giving read-only advice as it changes."

dependencies:
  tools:
    - type: "mcp"
      value: "hoonsoo"
      description: "Read-only local document monitor and revision-aware diff service"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
