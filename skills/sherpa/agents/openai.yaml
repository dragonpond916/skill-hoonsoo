interface:
  display_name: "Sherpa"
  short_description: "Fast save-triggered content and grammar review"
  default_prompt: "Use $sherpa <filepath> <prompt> to monitor disk-backed saves. Review each inline document or diff context immediately in one concise current-host pass, without subagents or file edits."

dependencies:
  tools:
    - type: "mcp"
      value: "sherpa"
      description: "Read-only document monitor with save results that embed review context and a lightweight publish gate"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
